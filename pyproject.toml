[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-agent"
version = "0.1.0"
description = "AI-агент продакта: из одной идеи — пакет discovery-артефактов"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.116.0",
    "PyYAML>=6.0",
]

[project.scripts]
discovery = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["discovery_agent"]
